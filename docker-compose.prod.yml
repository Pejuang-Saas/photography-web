services:
  web:
    build:
      context: .
      target: runner
    container_name: photography-web-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    restart: unless-stopped
