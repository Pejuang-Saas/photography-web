services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: photography-api
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/ready >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '3002:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - RUN_DB_MIGRATIONS=true
      - API_URL=${API_URL:-http://localhost:3002}
      - WEB_URL=${WEB_URL:-http://localhost:3000}
      - WEB_REVALIDATE_URL=http://photography-web:3000/api/revalidate/cms
      - WEB_REVALIDATE_SECRET=${WEB_REVALIDATE_SECRET:-}
      - BETTER_AUTH_URL=${API_URL:-http://localhost:3002}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PAYMENT_CONFIG_ENCRYPTION_KEY=${PAYMENT_CONFIG_ENCRYPTION_KEY}
      - OUTBOX_DELIVERY_MODE=${OUTBOX_DELIVERY_MODE:-log}
      # SMTP server (deploy-time only; the admin panel never sees these). Dev default is Mailpit.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-studio@kayastory.test}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Kayastory Photography}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-}
      - WAHA_ENABLED=${WAHA_ENABLED:-false}
      # Containers reach the shared WAHA by its container name; WAHA_BASE_URL in .env is for the host.
      - WAHA_BASE_URL=${WAHA_DOCKER_URL:-http://dev-waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - WAHA_ADMIN_CHAT_ID=${WAHA_ADMIN_CHAT_ID:-}
      # Where WAHA delivers incoming messages (as WAHA sees the API) and the key that signs them.
      - WAHA_WEBHOOK_URL=${WAHA_WEBHOOK_URL:-http://photography-api:3000/webhooks/waha}
      - WAHA_WEBHOOK_SECRET=${WAHA_WEBHOOK_SECRET:-}
      # Most messages the CRM may send per minute, counting everything the studio sent.
      - WHATSAPP_SEND_LIMIT_PER_MINUTE=${WHATSAPP_SEND_LIMIT_PER_MINUTE:-20}
      - DATABASE_URL=${DATABASE_URL:-postgresql://root:root@dev-postgres:5432/photography_db?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://dev-redis:6379}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9001/photography-assets}
      - S3_BUCKET=${S3_BUCKET:-photography-assets}
      - S3_PRIVATE_BUCKET=${S3_PRIVATE_BUCKET:-photography-private}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    networks:
      - dev-network

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: photography-worker
    restart: unless-stopped
    command: npm run start:worker:dev
    environment:
      - NODE_ENV=development
      - RUN_DB_MIGRATIONS=false
      - QUEUE_ALERT_INTERVAL_SECONDS=${QUEUE_ALERT_INTERVAL_SECONDS:-60}
      - QUEUE_FAILED_ALERT_THRESHOLD=${QUEUE_FAILED_ALERT_THRESHOLD:-1}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PAYMENT_CONFIG_ENCRYPTION_KEY=${PAYMENT_CONFIG_ENCRYPTION_KEY}
      - OUTBOX_DELIVERY_MODE=${OUTBOX_DELIVERY_MODE:-log}
      # SMTP server (deploy-time only; the admin panel never sees these). Dev default is Mailpit.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-studio@kayastory.test}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Kayastory Photography}
      - EMAIL_RATE_LIMIT_PER_MINUTE=${EMAIL_RATE_LIMIT_PER_MINUTE:-20}
      # Emails are rendered here, and templates link back to the site via {site_url}.
      - WEB_URL=${WEB_URL:-http://localhost:3000}
      # Public base URL of the API, used for the invoice download link in emails.
      - API_URL=${API_URL:-http://localhost:3002}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-}
      - WAHA_ENABLED=${WAHA_ENABLED:-false}
      # Containers reach the shared WAHA by its container name; WAHA_BASE_URL in .env is for the host.
      - WAHA_BASE_URL=${WAHA_DOCKER_URL:-http://dev-waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - WAHA_ADMIN_CHAT_ID=${WAHA_ADMIN_CHAT_ID:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://root:root@dev-postgres:5432/photography_db?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://dev-redis:6379}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9001/photography-assets}
      - S3_BUCKET=${S3_BUCKET:-photography-assets}
      - S3_PRIVATE_BUCKET=${S3_PRIVATE_BUCKET:-photography-private}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    networks:
      - dev-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: photography-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9001:9000'
      - '9002:9001'
    volumes:
      - minio-data:/data
    networks:
      - dev-network

  # Development mail catcher: the API sends through it (SMTP host `mailpit`, port 1025, no auth)
  # and every message shows up at http://localhost:8025 instead of reaching real inboxes.
  mailpit:
    image: axllent/mailpit:latest
    container_name: photography-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - dev-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: photography-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_SITE_URL=${WEB_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:3002}
      - API_INTERNAL_URL=http://photography-api:3000
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
    env_file:
      - path: ./apps/web/.env
        required: false
      - path: ./apps/web/.env.local
        required: false
    stdin_open: true
    tty: true
    depends_on:
      - api
    networks:
      - dev-network

networks:
  dev-network:
    name: dev-network
    external: true

volumes:
  minio-data:
