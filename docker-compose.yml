services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: photography-api
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_URL=${API_URL:-http://localhost:3002}
      - WEB_URL=${WEB_URL:-http://localhost:3000}
      - BETTER_AUTH_URL=${API_URL:-http://localhost:3002}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgresql://root:root@dev-postgres:5432/photography_db?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://dev-redis:6379}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9001/photography-assets}
      - S3_BUCKET=${S3_BUCKET:-photography-assets}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    networks:
      - dev-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: photography-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9001:9000"
      - "9002:9001"
    volumes:
      - minio-data:/data
    networks:
      - dev-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: photography-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_SITE_URL=${WEB_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:3002}
      - API_INTERNAL_URL=http://photography-api:3000
    env_file:
      - path: ./apps/web/.env
        required: false
      - path: ./apps/web/.env.local
        required: false
    stdin_open: true
    tty: true
    depends_on:
      - api
    networks:
      - dev-network

networks:
  dev-network:
    name: dev-network
    external: true

volumes:
  minio-data:
